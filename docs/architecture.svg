<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 15px; font-weight: 600; fill: #18181b; }
    .s { font-size: 12.5px; fill: #52525b; }
    .h { font-size: 20px; font-weight: 700; fill: #18181b; }
    .m { font-size: 13px; fill: #71717a; }
    .l { font-size: 12px; fill: #52525b; }
    .line { stroke: #a1a1aa; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="1040" height="600" fill="#fafafa"/>
  <text x="32" y="44" class="h">Architecture</text>
  <text x="32" y="66" class="m">Gemini reads, writes and looks things up. Code decides. Everything runs on Google Cloud.</text>

  <!-- browser and web -->
  <rect x="32" y="100" width="210" height="60" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="48" y="126" class="t">Approver</text>
  <text x="48" y="146" class="s">Browser</text>
  <line x1="137" y1="160" x2="137" y2="206" class="line" marker-end="url(#a)"/>
  <rect x="32" y="210" width="210" height="84" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="48" y="236" class="t">web</text>
  <text x="48" y="256" class="s">Next.js 16 on Cloud Run</text>
  <text x="48" y="274" class="s">Public. Approval queue, evaluation</text>

  <line x1="242" y1="252" x2="296" y2="252" class="line" marker-end="url(#a)"/>
  <text x="269" y="242" class="l" text-anchor="middle">ID token</text>

  <!-- agent -->
  <rect x="300" y="100" width="410" height="374" rx="10" fill="#fff" stroke="#18181b" stroke-width="1.5"/>
  <text x="318" y="128" class="t">agent</text>
  <text x="368" y="128" class="s">ADK 2.10 Workflow on Cloud Run. Private.</text>

  <rect x="320" y="146" width="370" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="336" y="170" class="t" fill="#1d4ed8">Reader · Gemini</text>
  <text x="336" y="190" class="s">Email, chat screenshot, invoice → fields with evidence</text>

  <rect x="320" y="220" width="370" height="58" rx="8" fill="#f4f4f5" stroke="#18181b"/>
  <text x="336" y="244" class="t">Rules · code</text>
  <text x="336" y="264" class="s">Compare with the ledger and lookups; set the tier</text>

  <rect x="320" y="294" width="370" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="336" y="318" class="t" fill="#1d4ed8">Finder · Gemini + Google Search</text>
  <text x="336" y="338" class="s">A new payee's official number; code confirms it</text>

  <rect x="320" y="368" width="370" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="336" y="392" class="t" fill="#1d4ed8">Explainer · Gemini</text>
  <text x="336" y="412" class="s">Notice from the findings only; code checks it</text>

  <text x="320" y="456" class="l">Routine payments stop after the rules: one model call.</text>

  <!-- services -->
  <g>
    <rect x="780" y="100" width="228" height="58" rx="8" fill="#fff" stroke="#d4d4d8"/>
    <text x="796" y="124" class="t">Gemini 3.8 Flash</text>
    <text x="796" y="144" class="s">Agent Platform (Vertex AI)</text>

    <rect x="780" y="170" width="228" height="58" rx="8" fill="#fff" stroke="#d4d4d8"/>
    <text x="796" y="194" class="t">Model Armor</text>
    <text x="796" y="214" class="s">Prompt injection, jailbreak</text>

    <rect x="780" y="240" width="228" height="58" rx="8" fill="#fff" stroke="#d4d4d8"/>
    <text x="796" y="264" class="t">Web Risk API</text>
    <text x="796" y="284" class="s">Links in the instruction</text>

    <rect x="780" y="310" width="228" height="58" rx="8" fill="#fff" stroke="#d4d4d8" stroke-dasharray="5 4"/>
    <text x="796" y="334" class="t">RDAP</text>
    <text x="796" y="354" class="s">Sender domain age (public)</text>

    <rect x="780" y="380" width="228" height="58" rx="8" fill="#fff" stroke="#d4d4d8"/>
    <text x="796" y="404" class="t">Firestore</text>
    <text x="796" y="424" class="s">Ledger, approval queue, calls</text>

    <rect x="780" y="450" width="228" height="58" rx="8" fill="#fff" stroke="#d4d4d8"/>
    <text x="796" y="474" class="t">BigQuery</text>
    <text x="796" y="494" class="s">Audit events, metadata only</text>
  </g>
  <line x1="710" y1="129" x2="776" y2="129" class="line" marker-end="url(#a)"/>
  <line x1="710" y1="199" x2="776" y2="199" class="line" marker-end="url(#a)"/>
  <line x1="710" y1="269" x2="776" y2="269" class="line" marker-end="url(#a)"/>
  <line x1="710" y1="339" x2="776" y2="339" class="line" marker-end="url(#a)"/>
  <line x1="710" y1="409" x2="776" y2="409" class="line" marker-end="url(#a)"/>
  <path d="M744 409V479H776" class="line" marker-end="url(#a)"/>

  <!-- deploy -->
  <rect x="32" y="528" width="976" height="44" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="48" y="555" class="s"><tspan font-weight="600" fill="#18181b">Deploy</tspan>   GitHub Actions → Workload Identity Federation (no keys) → Cloud Build → Cloud Run, Firestore and BigQuery in asia-southeast1</text>

  <!-- legend -->
  <rect x="32" y="330" width="14" height="14" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="54" y="342" class="l">Gemini: reads, writes, looks up</text>
  <rect x="32" y="356" width="14" height="14" rx="3" fill="#f4f4f5" stroke="#18181b"/>
  <text x="54" y="368" class="l">Code: decides</text>
  <rect x="32" y="382" width="14" height="14" rx="3" fill="#fff" stroke="#d4d4d8"/>
  <text x="54" y="394" class="l">Google Cloud service</text>
  <rect x="32" y="408" width="14" height="14" rx="3" fill="#fff" stroke="#d4d4d8" stroke-dasharray="3 2"/>
  <text x="54" y="420" class="l">Public service outside Google Cloud</text>
</svg>
