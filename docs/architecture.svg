<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 15px; font-weight: 600; fill: #18181b; }
    .s { font-size: 12.5px; fill: #52525b; }
    .h { font-size: 20px; font-weight: 700; fill: #18181b; }
    .m { font-size: 13px; fill: #71717a; }
    .l { font-size: 12px; fill: #52525b; }
    .line { stroke: #a1a1aa; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="1040" height="690" fill="#fafafa"/>
  <text x="32" y="44" class="h">Architecture</text>
  <text x="32" y="66" class="m">Each stage and the service it calls. Gemini reads, finds, writes and calls. Code decides.</text>

  <!-- browser and web -->
  <rect x="32" y="100" width="196" height="60" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="48" y="126" class="t">Approver</text>
  <text x="48" y="146" class="s">Browser</text>
  <line x1="130" y1="160" x2="130" y2="206" class="line" marker-end="url(#a)"/>
  <rect x="32" y="210" width="196" height="84" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="48" y="236" class="t">web</text>
  <text x="48" y="256" class="s">Next.js 16 on Cloud Run</text>
  <text x="48" y="274" class="s">Public. Queue, evaluation</text>

  <line x1="228" y1="252" x2="282" y2="252" class="line" marker-end="url(#a)"/>
  <text x="255" y="242" class="l" text-anchor="middle">ID token</text>

  <!-- agent -->
  <rect x="286" y="100" width="356" height="472" rx="10" fill="#fff" stroke="#18181b" stroke-width="1.5"/>
  <text x="304" y="128" class="t">agent</text>
  <text x="354" y="128" class="s">ADK 2.10 on Cloud Run. Private.</text>

  <rect x="302" y="146" width="324" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="318" y="172" class="t" fill="#1d4ed8">1  Reader · Gemini</text>
  <text x="318" y="192" class="s">Email, chat image, invoice → fields with quotes</text>

  <rect x="302" y="226" width="324" height="62" rx="8" fill="#f4f4f5" stroke="#18181b"/>
  <text x="318" y="252" class="t">2  Rules · code</text>
  <text x="318" y="272" class="s">Compare with ledger and lookups; set the tier</text>

  <rect x="302" y="306" width="324" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="318" y="332" class="t" fill="#1d4ed8">Finder · Gemini</text>
  <text x="318" y="352" class="s">New payee only: official number; code confirms it</text>

  <rect x="302" y="386" width="324" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="318" y="412" class="t" fill="#1d4ed8">3  Explainer · Gemini</text>
  <text x="318" y="432" class="s">Only when something differs; sees the findings only</text>

  <rect x="302" y="466" width="324" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="318" y="492" class="t" fill="#1d4ed8">4  Call · Gemini Live</text>
  <text x="318" y="512" class="s">Verify only: payee states account; code compares</text>

  <text x="302" y="554" class="l">Routine payments stop after the rules: one model call.</text>

  <!-- 1 reader: Model Armor, then Gemini -->
  <line x1="626" y1="177" x2="664" y2="177" class="line" marker-end="url(#a)"/>
  <rect x="668" y="146" width="150" height="62" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="682" y="172" class="t">Model Armor</text>
  <text x="682" y="192" class="s">Prompt and response</text>
  <line x1="818" y1="177" x2="838" y2="177" class="line" marker-end="url(#a)"/>
  <rect x="842" y="146" width="166" height="62" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="856" y="172" class="t">Gemini 3.8 Flash</text>
  <text x="856" y="192" class="s">Vertex AI</text>

  <!-- 2 rules: Web Risk, RDAP -->
  <path d="M626 257H646V241H664" class="line" marker-end="url(#a)"/>
  <path d="M646 257V273H664" class="line" marker-end="url(#a)"/>
  <rect x="668" y="226" width="340" height="29" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="682" y="245" class="s"><tspan font-weight="600" fill="#18181b" font-size="14">Web Risk API</tspan>   Links in the instruction</text>
  <rect x="668" y="259" width="340" height="29" rx="8" fill="#fff" stroke="#d4d4d8" stroke-dasharray="5 4"/>
  <text x="682" y="278" class="s"><tspan font-weight="600" fill="#18181b" font-size="14">RDAP</tspan>   Sender domain age (public)</text>

  <!-- finder: Gemini with Google Search, called directly -->
  <line x1="626" y1="337" x2="664" y2="337" class="line" marker-end="url(#a)"/>
  <rect x="668" y="306" width="340" height="62" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="682" y="332" class="t">Gemini 3.8 Flash + Google Search</text>
  <text x="682" y="352" class="s">Grounding. Gets the payee's name only</text>

  <!-- 3 explainer: Model Armor, then Gemini -->
  <line x1="626" y1="417" x2="664" y2="417" class="line" marker-end="url(#a)"/>
  <rect x="668" y="386" width="150" height="62" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="682" y="412" class="t">Model Armor</text>
  <text x="682" y="432" class="s">Prompt and response</text>
  <line x1="818" y1="417" x2="838" y2="417" class="line" marker-end="url(#a)"/>
  <rect x="842" y="386" width="166" height="62" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="856" y="412" class="t">Gemini 3.8 Flash</text>
  <text x="856" y="432" class="s">Vertex AI</text>

  <!-- 4 call: ADK run_live on Gemini Live -->
  <line x1="626" y1="497" x2="664" y2="497" class="line" marker-end="url(#a)"/>
  <rect x="668" y="466" width="340" height="62" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="682" y="492" class="t">Gemini 3.8 Live · us-central1</text>
  <text x="682" y="512" class="s">ADK run_live. Never given the account or the amount</text>

  <!-- stores -->
  <path d="M642 559H664" class="line" marker-end="url(#a)"/>
  <rect x="668" y="546" width="166" height="52" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="682" y="568" class="t">Firestore</text>
  <text x="682" y="586" class="s">Ledger, queue, calls</text>
  <rect x="842" y="546" width="166" height="52" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="856" y="568" class="t">BigQuery</text>
  <text x="856" y="586" class="s">Audit, metadata only</text>

  <!-- deploy -->
  <rect x="32" y="620" width="976" height="44" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="48" y="647" class="s"><tspan font-weight="600" fill="#18181b">Deploy</tspan>   GitHub Actions → Workload Identity Federation (no keys) → Cloud Build → Cloud Run, Firestore and BigQuery in asia-southeast1</text>

  <!-- legend -->
  <rect x="32" y="330" width="14" height="14" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="54" y="342" class="l">Gemini: reads, finds, writes, calls</text>
  <rect x="32" y="356" width="14" height="14" rx="3" fill="#f4f4f5" stroke="#18181b"/>
  <text x="54" y="368" class="l">Code: decides</text>
  <rect x="32" y="382" width="14" height="14" rx="3" fill="#fff" stroke="#d4d4d8"/>
  <text x="54" y="394" class="l">Google Cloud service</text>
  <rect x="32" y="408" width="14" height="14" rx="3" fill="#fff" stroke="#d4d4d8" stroke-dasharray="3 2"/>
  <text x="54" y="420" class="l">Public service outside</text>
  <text x="54" y="436" class="l">Google Cloud</text>
</svg>
